module_name: m113

parameters:
    - group: M113
      definitions:
        M113_GEAR_R:
            description:
                short: MD80 reverse gear position
                long: |
                    Position target used by the M113 MD80 gear motor when selecting reverse.
                    It can be updated from the MAVLink shell with: m113 gear set R.
            type: int32
            reboot_required: false
            default: 0

        M113_GEAR_N:
            description:
                short: MD80 neutral gear position
                long: |
                    Position target used by the M113 MD80 gear motor when selecting neutral.
                    It can be updated from the MAVLink shell with: m113 gear set N.
            type: int32
            reboot_required: false
            default: 1000

        M113_GEAR_1:
            description:
                short: MD80 first gear position
                long: |
                    Position target used by the M113 MD80 gear motor when selecting first gear.
                    It can be updated from the MAVLink shell with: m113 gear set 1.
            type: int32
            reboot_required: false
            default: 2000

        M113_GEAR_2:
            description:
                short: MD80 second gear position
                long: |
                    Position target used by the M113 MD80 gear motor when selecting second gear.
                    It can be updated from the MAVLink shell with: m113 gear set 2.
            type: int32
            reboot_required: false
            default: 3000

        M113_TH1_BRK:
            description:
                short: Thomson 1 brake position
                long: |
                    Brake position used by Thomson actuator 1.
                    It can be updated from the MAVLink shell with: m113 thomson pos 1 brake.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1000

        M113_TH1_DEF:
            description:
                short: Thomson 1 default position
                long: |
                    Default position used by Thomson actuator 1 when the brake joystick is centered.
                    It can be updated from the MAVLink shell with: m113 thomson pos 1 default.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1250

        M113_TH1_MAX:
            description:
                short: Thomson 1 maximum position
                long: |
                    Maximum allowed command position for Thomson actuator 1.
                    It can be updated from the MAVLink shell with: m113 thomson pos 1 max.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1500

        M113_TH2_BRK:
            description:
                short: Thomson 2 brake position
                long: |
                    Brake position used by Thomson actuator 2.
                    It can be updated from the MAVLink shell with: m113 thomson pos 2 brake.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1000

        M113_TH2_DEF:
            description:
                short: Thomson 2 default position
                long: |
                    Default position used by Thomson actuator 2 when the brake joystick is centered.
                    It can be updated from the MAVLink shell with: m113 thomson pos 2 default.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1250

        M113_TH2_MAX:
            description:
                short: Thomson 2 maximum position
                long: |
                    Maximum allowed command position for Thomson actuator 2.
                    It can be updated from the MAVLink shell with: m113 thomson pos 2 max.
            type: int32
            reboot_required: false
            min: 0
            max: 1500
            default: 1500
